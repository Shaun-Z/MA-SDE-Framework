# Load replaces workspace with current Workspace's name。
version: 2
id: sde-team
workspace: SDE
goal: ""

commonPromptFiles:
  - prompts/sde-team-common.md

orchestratorMemberId: anchor-gemini

roles:
  - id: anchor
    name: Anchor
    promptFiles:
      - prompts/anchor.md
  - id: developer
    name: Developer
    promptFiles:
      - prompts/developer.md
  - id: tester
    name: Tester
    promptFiles:
      - prompts/tester.md

members:
  - id: anchor-gemini
    name: Anchor
    roleId: anchor
    launchSnapshot:
      provider: antigravity-cli
      model: gemini-pro-orchestrator
      modeId: accept-edits
      featureValues:
        approvalPolicy: skip
        sandbox: on
        shareMcp: on
  - id: developer-gpt
    name: Developer
    roleId: developer
    launchSnapshot:
      provider: codex
      model: gpt-6.1-sol
      modeId: auto-review
      thinkingOptionId: high
  - id: tester-ds
    name: Tester
    roleId: tester
    launchSnapshot:
      provider: pi
      model: deepseek/deepseek-flash
      thinkingOptionId: high
